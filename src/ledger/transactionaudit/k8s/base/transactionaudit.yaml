apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactionaudit
spec:
  selector:
    matchLabels:
      app: transactionaudit
  template:
    metadata:
      labels:
        app: transactionaudit
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 5
      containers:
      - name: transactionaudit
        image: transactionaudit
        env:
        - name: VERSION
          value: "dev"
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: AUDIT_INTERVAL_MS
          value: "60000"
        - name: AUDIT_INITIAL_DELAY_MS
          value: "15000"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: JVM_OPTS
          value: "-Xms128m -Xmx256m"
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
            ephemeral-storage: 0.5Gi
          limits:
            cpu: 250m
            memory: 384Mi
            ephemeral-storage: 0.5Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthy
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        startupProbe:
          httpGet:
            path: /healthy
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transactionaudit
spec:
  type: ClusterIP
  selector:
    app: transactionaudit
  ports:
  - name: http
    port: 8080
    targetPort: 8080
