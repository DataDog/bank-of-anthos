apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: bank-of-anthos
  region: us-west-2
  tags:
    owner: alessandro.lucarelli
    project: bank-of-anthos
    env: dev

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.xlarge
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    tags:
      owner: alessandro.lucarelli
      project: bank-of-anthos
      env: dev

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
